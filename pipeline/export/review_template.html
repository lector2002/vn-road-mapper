<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Surface Edit Review</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root { --bg: #fffdf8; --ink: #1d1c1a; --muted: #6d675c; --line: #cbc3b2; }
@media (prefers-color-scheme: dark) { :root { --bg: #212329; --ink: #ece9e2; --muted: #a39e93; --line: #4a4c55; } }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: "Segoe UI", Arial, sans-serif; }
#map { position: absolute; inset: 0 0 0 320px; }
aside { position: absolute; inset: 0 auto 0 0; width: 320px; box-sizing: border-box; padding: 16px; overflow-y: auto;
  border-right: 1px solid var(--line); }
h1 { font: 700 22px Georgia, serif; margin: 0 0 6px; }
p { font-size: 14px; color: var(--muted); margin: 0 0 12px; line-height: 1.4; }
.row { display: flex; gap: 8px; align-items: center; font-size: 15px; padding: 4px 0; }
.sw { width: 22px; height: 5px; border-radius: 2px; }
@media (max-width: 700px) { aside { inset: auto 0 0 0; width: auto; height: 40%; border-right: 0; border-top: 1px solid var(--line); }
  #map { inset: 0 0 40% 0; } }
</style>
</head>
<body>
<aside>
  <h1>Proposed surface edits</h1>
  <p>Each line is an OSM way the rides covered. Click a line for the vote and the current tag. Nothing here is uploaded.</p>
  <div id="legend"></div>
</aside>
<div id="map"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const DATA = /*GEOJSON*/null;
const LABELS = { add: "add surface tag", change: "change surface tag", agree: "OSM already agrees", weak: "too few or split votes", unknown: "unusual current value" };
const COLORS = { add: "#1f45cf", change: "#c4452f", agree: "#2f8a3c", weak: "#9a9a9a", unknown: "#b8890f" };
const counts = {};
DATA.features.forEach((f) => { counts[f.properties.status] = (counts[f.properties.status] || 0) + 1; });
document.getElementById("legend").innerHTML = Object.keys(LABELS).map((s) =>
  `<div class="row"><span class="sw" style="background:${COLORS[s]}"></span>${LABELS[s]}: ${counts[s] || 0}</div>`).join("");
const map = L.map("map");
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "&copy; OpenStreetMap contributors" }).addTo(map);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const layer = L.geoJSON(DATA, {
  style: (f) => ({ color: f.properties.color, weight: 6, opacity: 0.9 }),
  onEachFeature: (f, l) => {
    const p = f.properties;
    l.bindPopup(`<b>${esc(p.name || "way " + p.way_id)}</b> (${esc(p.highway)})<br>
      ${esc(LABELS[p.status])}<br>
      OSM now: ${esc(p.current_surface || "no surface tag")}<br>
      Proposed: ${esc(p.proposed_surface || "nothing")}<br>
      Model: ${esc(p.surface || "no vote")}, agreement ${esc(p.agreement)}, ${esc(p.votes)} votes<br>
      Frames showing water: ${esc(p.water_share)}<br>
      Estimated width: ${p.width_m ? esc(p.width_m) + " m" : "not measured"}<br>
      <a href="https://www.openstreetmap.org/way/${esc(p.way_id)}" target="_blank" rel="noopener">open in OSM</a>`);
  },
}).addTo(map);
if (DATA.features.length) map.fitBounds(layer.getBounds(), { padding: [30, 30] }); else map.setView([16, 107], 5);
</script>
</body>
</html>
