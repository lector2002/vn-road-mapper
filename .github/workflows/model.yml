name: model

# The default tests never load SegFormer. This runs the real model weekly and when the model code or its
# dependencies change, so an upstream transformers or checkpoint change cannot break the main stage unseen.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
  push:
    paths:
      - "pipeline/segmentation/**"
      - "pipeline/width/**"
      - "requirements-model.txt"
      - ".github/workflows/model.yml"

jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('pipeline/segmentation/segment.py') }}
          restore-keys: hf-
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-model.txt -r requirements-dev.txt
      - run: python -m pytest tests -q
        env:
          RUN_MODEL_TESTS: "1"
