name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # torch and transformers are only imported when a model loads; the default tests do not load one.
      - run: pip install gpxpy numpy pillow pytest
      - run: python -m pytest tests -q
