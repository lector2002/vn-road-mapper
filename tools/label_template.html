<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Road surface labels</title>
<style>
:root { --bg: #fffdf8; --ink: #1d1c1a; --muted: #6d675c; --line: #cbc3b2; --box: #ffd400; }
@media (prefers-color-scheme: dark) { :root { --bg: #212329; --ink: #ece9e2; --muted: #a39e93; --line: #4a4c55; } }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Segoe UI", Arial, sans-serif; }
main { max-width: 960px; margin: 0 auto; padding: 12px; }
h1 { font: 700 20px Georgia, serif; margin: 0 0 4px; }
p { font-size: 14px; color: var(--muted); margin: 0 0 10px; line-height: 1.4; }
.frame { position: relative; line-height: 0; }
.frame img { width: 100%; height: auto; border-radius: 4px; }
.roi { position: absolute; top: 60%; left: 20%; width: 60%; height: 40%; box-sizing: border-box; border: 3px solid var(--box);
  box-shadow: 0 0 0 1px #000; pointer-events: none; }
.buttons { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 10px 0; }
button { font-size: 16px; padding: 12px 4px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--ink);
  cursor: pointer; }
button.chosen { background: var(--ink); color: var(--bg); }
.bar { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: var(--muted); }
textarea { width: 100%; height: 140px; font: 12px monospace; box-sizing: border-box; }
.hidden { display: none; }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p>What is the road surface inside the yellow box? Pick the surface most of the box shows. Keys 1–5 pick, ← goes back.
    Your answers stay in this browser until you send them.</p>
  <div id="label">
    <div class="bar"><span id="progress"></span><button id="back">← Back</button></div>
    <div class="frame"><img id="photo" alt="street photo"><div class="roi"></div></div>
    <div class="buttons" id="choices"></div>
    <p id="credit"></p>
  </div>
  <div id="done" class="hidden">
    <p id="summary"></p>
    <div class="buttons"><button id="download">Download CSV</button><button id="copy">Copy</button><button id="review">Review</button></div>
    <p>Send the CSV (or paste the copied text) back to Devin.</p>
    <textarea id="csv" readonly></textarea>
  </div>
</main>
<script>
const PAGE = /*DATA*/null;
const CHOICES = ["paved", "unpaved", "mud", "water", "unclear"];
const HINTS = { paved: "asphalt, concrete, brick", unpaved: "dirt, gravel, sand", mud: "wet, soft dirt", water: "road under water", unclear: "can't tell" };
const store = "labels:" + PAGE.id;
// Some viewers (sandboxed previews) block storage; answers then last only while the page is open.
const saved = { get() { try { return localStorage.getItem(store); } catch (e) { return null; } },
  set(v) { try { localStorage.setItem(store, v); } catch (e) { /* keep going without storage */ } } };
const answers = JSON.parse(saved.get() || "{}");
let i = PAGE.items.findIndex((it) => !answers[it.key]);
if (i < 0) i = PAGE.items.length;
document.getElementById("title").textContent = PAGE.title;
document.title = PAGE.title;
const choices = document.getElementById("choices");
CHOICES.forEach((c, n) => {
  const b = document.createElement("button");
  b.innerHTML = `${n + 1} ${c}<br><small>${HINTS[c]}</small>`;
  b.onclick = () => pick(c);
  b.dataset.choice = c;
  choices.appendChild(b);
});
function show() {
  const finished = i >= PAGE.items.length;
  document.getElementById("label").classList.toggle("hidden", finished);
  document.getElementById("done").classList.toggle("hidden", !finished);
  if (finished) return done();
  const it = PAGE.items[i];
  document.getElementById("photo").src = it.src;
  document.getElementById("progress").textContent = `${i + 1} of ${PAGE.items.length}`;
  document.getElementById("credit").textContent = it.credit || "";
  choices.querySelectorAll("button").forEach((b) => b.classList.toggle("chosen", answers[it.key] === b.dataset.choice));
}
function pick(c) {
  answers[PAGE.items[i].key] = c;
  saved.set(JSON.stringify(answers));
  i += 1;
  show();
}
function csv() {
  const lines = [PAGE.columns.concat(["surface_by_eye"]).join(",")];
  PAGE.items.forEach((it) => { if (answers[it.key]) lines.push(it.fields.concat([answers[it.key]]).join(",")); });
  return lines.join("\n") + "\n";
}
function done() {
  const n = PAGE.items.filter((it) => answers[it.key]).length;
  document.getElementById("summary").textContent = `Done: ${n} of ${PAGE.items.length} photos labelled. Thank you.`;
  document.getElementById("csv").value = csv();
}
document.getElementById("back").onclick = () => { if (i > 0) { i -= 1; show(); } };
document.getElementById("review").onclick = () => { i = 0; show(); };
document.getElementById("copy").onclick = () => {
  const box = document.getElementById("csv");
  box.select();
  if (navigator.clipboard) navigator.clipboard.writeText(csv()).catch(() => document.execCommand("copy"));
  else document.execCommand("copy");
};
document.getElementById("download").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv()], { type: "text/csv" }));
  a.download = PAGE.id + "-labels.csv";
  a.click();
};
document.addEventListener("keydown", (e) => {
  if (i < PAGE.items.length && e.key >= "1" && e.key <= "5") pick(CHOICES[+e.key - 1]);
  if (e.key === "ArrowLeft" && i > 0) { i -= 1; show(); }
});
show();
</script>
</body>
</html>
